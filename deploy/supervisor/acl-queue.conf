; ACL — queue workers
; Run: sudo cp deploy/supervisor/acl-queue.conf /etc/supervisor/conf.d/
;      sudo supervisorctl reread && sudo supervisorctl update
;
; Requires QUEUE_CONNECTION=redis (ADR-0008). Without a worker, queued jobs
; accumulate in Redis and never execute.

[program:acl-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /home/ubuntu/ACL/artisan queue:work redis --queue=default --sleep=1 --tries=3 --max-time=3600 --max-jobs=1000
directory=/home/ubuntu/ACL
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/home/ubuntu/ACL/storage/logs/queue-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
