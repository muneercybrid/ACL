# ACL nginx main configuration. Replaces the Debian default outright.

user                 www-data;
worker_processes     auto;
pid                  /run/nginx.pid;
error_log            /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to the container's own streams and never to a file inside the
    # image: an ephemeral disk with nothing rotating it fills up silently.
    log_format  acl  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log  /dev/stdout  acl;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Do not advertise the version in responses or on error pages.
    server_tokens       off;

    # Must stay above PHP's post_max_size, or nginx rejects an oversized body
    # with a 413 the application never sees and cannot explain to the user.
    client_max_body_size  22m;
    client_body_timeout   30s;
    client_header_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        application/javascript
                      application/json
                      application/xml
                      application/rss+xml
                      font/woff2
                      image/svg+xml
                      text/css
                      text/javascript
                      text/plain
                      text/xml;

    include  /etc/nginx/conf.d/*.conf;
}
