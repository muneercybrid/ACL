; ACL php-fpm pool overrides.
;
; Loaded as php-fpm.d/zz-acl.conf, after the image's own www.conf, so every
; directive here wins.

[www]

; THE load-bearing line in this file. php-fpm empties each worker's environment
; by default, which hides every variable the hosting platform injects -- APP_KEY,
; DB_HOST, DB_PASSWORD, all of it -- and leaves env() silently falling back to
; its defaults. The symptom is an app that boots and then fails with "No
; application encryption key has been specified", or one that quietly tries to
; reach 127.0.0.1 for its database.
clear_env = no

; Warnings and fatals from a worker reach the master, whose log is stderr, so
; they end up in the platform's log stream. Undecorated, so each line stays
; greppable.
catch_workers_output   = yes
decorate_workers_output = no

; Sized for a small instance. 12 x 256M is 3 GB of worst case, which only
; materialises if every worker simultaneously reaches memory_limit.
pm                   = dynamic
pm.max_children      = 12
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers, so a slow leak anywhere in the dependency tree cannot
; accumulate across the life of the container.
pm.max_requests = 500

; nginx is in this same container, so this socket is never reachable from
; outside it.
listen = 127.0.0.1:9000

; Report a request that has been running for a suspiciously long time, with a
; PHP backtrace, instead of leaving it invisible.
request_slowlog_timeout = 10s
slowlog                 = /dev/stderr
