; ACL production PHP settings.
;
; Loaded as conf.d/zz-acl.ini so it is read after everything the base image
; ships, and wins.

; --- Error handling -------------------------------------------------------
; A visitor never sees a stack trace. Laravel formats application errors
; itself; these settings cover what happens before or outside its handler.
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL & ~E_DEPRECATED

; --- Disclosure -----------------------------------------------------------
expose_php = Off

; --- Limits ---------------------------------------------------------------
; The concurrency ceiling is pm.max_children x memory_limit. Raise one and
; check the other against the instance's RAM.
memory_limit         = 256M
max_execution_time   = 30
post_max_size        = 21M
upload_max_filesize  = 20M

; --- OPcache --------------------------------------------------------------
; The filesystem inside a container never changes between restarts, so
; revalidating timestamps is pure overhead. This is correct here and would be
; wrong in development.
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 0
; Kept on: Laravel reads attributes and doc comments via reflection.
opcache.save_comments           = 1
; JIT is deliberately off. A request-response Laravel app is I/O bound, the
; measured gain is close to noise, and it is a large amount of new
; machine-code surface for that.
opcache.jit                     = disable

; --- Misc -----------------------------------------------------------------
date.timezone = UTC
