# ACL process supervisor.
#
# One container, two long-lived processes. Docker will only watch PID 1, so
# something has to own both and restart whichever one dies; that is all
# supervisord is here for.

[supervisord]
nodaemon         = true
user             = root
pidfile          = /tmp/supervisord.pid
# Supervisor's own log is noise once the two children log to stderr themselves.
logfile          = /dev/null
logfile_maxbytes = 0
loglevel         = info

[program:php-fpm]
command          = php-fpm --nodaemonize --force-stderr
priority         = 10
autostart        = true
autorestart      = true
startsecs        = 3
stopsignal       = QUIT
stopwaitsecs     = 20
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
# php-fpm is listed first and starts first; nginx tolerates an upstream that is
# not yet listening, so no explicit wait is needed.
command          = nginx -g "daemon off;"
priority         = 20
autostart        = true
autorestart      = true
startsecs        = 3
# QUIT is nginx's graceful shutdown: finish in-flight requests, then exit.
stopsignal       = QUIT
stopwaitsecs     = 20
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0

# ACL has no queued jobs yet, so there is no worker here. When the first job
# arrives, add a [program:queue] running `php artisan queue:work --tries=3` --
# QUEUE_CONNECTION=database, so it needs no broker, only the same database.
