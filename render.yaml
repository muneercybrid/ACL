# ACL infrastructure as code, for Render.
#
# One web service, built from the repository's Dockerfile. Render has no native
# PHP runtime, so `runtime: docker` is not a preference here -- it is the only
# way a Laravel application deploys on this platform.
#
# The database is deliberately NOT declared below. Render offers managed
# PostgreSQL and a Redis-compatible Key Value store, and no managed
# MySQL/MariaDB at all; ADR-0005 requires MariaDB in every environment. ACL
# therefore points at a MariaDB supplied elsewhere. See ADR-0006 and
# docs/deployment/README.md.
#
# Nothing secret belongs in this file. Every value marked `sync: false` is set
# once, by hand, in the Render dashboard, and is never committed.

services:
  - type: web
    name: acl
    runtime: docker

    # Frankfurt is the closest Render region to Nigeria -- roughly half the
    # round trip of the US regions. Changing region later means recreating the
    # service, so it is worth getting right now.
    region: frankfurt

    # `free` also works and costs nothing, but it spins the instance down after
    # inactivity, and the next visitor waits for a cold start that re-runs
    # migrations and rebuilds every cache. For a service on a real domain,
    # `starter` is the smallest plan that stays awake.
    plan: starter

    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true

    # Already wired in bootstrap/app.php, so this needs no new code.
    healthCheckPath: /up

    envVars:
      # --- Application -----------------------------------------------------
      - key: APP_NAME
        value: ACL
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate ONCE with `php artisan key:generate --show` and paste it in.
      # Changing it later invalidates every session and makes every encrypted
      # column unreadable. docker/entrypoint.sh refuses to start without it.
      - key: APP_KEY
        sync: false
      # The public https:// URL. Wrong here means wrong links in every email
      # and redirect.
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en

      # --- Logging ---------------------------------------------------------
      # stderr, not the stack: a file inside the container is unreadable and
      # grows on a disk nothing rotates. Render collects stderr.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: LOG_DEPRECATIONS_CHANNEL
        value: "null"

      # --- Database (ADR-0005: MariaDB) ------------------------------------
      - key: DB_CONNECTION
        value: mariadb
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Only for a managed provider that requires TLS and gives you a CA
      # bundle. config/database.php already reads this. Leave unset otherwise.
      - key: MYSQL_ATTR_SSL_CA
        sync: false

      # --- Drivers (all database-backed; there is no Redis) ----------------
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      # The session cookie must never travel over plain HTTP. Render
      # terminates TLS and redirects HTTP, so this is safe to force on.
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

      # --- Mail ------------------------------------------------------------
      # Honest default: no mail provider is configured, and ACL sends no mail
      # yet. `log` writes messages to stderr instead of pretending to deliver.
      - key: MAIL_MAILER
        value: log

      # --- Deployment behaviour --------------------------------------------
      # The entrypoint applies migrations on start. Set this to false and move
      # migrations to a pre-deploy command once this service runs more than one
      # instance -- concurrent `migrate` on boot races.
      - key: ACL_RUN_MIGRATIONS
        value: "true"

# ---------------------------------------------------------------------------
# The alternative: MariaDB inside Render
# ---------------------------------------------------------------------------
# Uncomment this to run the database as a Render private service instead of
# using an external provider. It is reachable only from services in this same
# workspace, on the internal hostname `acl-mariadb:3306`, and is never exposed
# to the internet.
#
# Read the trade-off in ADR-0006 before choosing it: a private service is a
# single container with no replication and no failover, and Render's own
# documentation warns that disk snapshots will likely corrupt database files,
# so `mysqldump` is the only backup you can trust. Set DB_HOST to
# `acl-mariadb` and DB_PORT to `3306` on the web service above.
#
#  - type: pserv
#    name: acl-mariadb
#    runtime: image
#    region: frankfurt          # must match the web service
#    plan: starter
#    image:
#      url: docker.io/library/mariadb:10.11
